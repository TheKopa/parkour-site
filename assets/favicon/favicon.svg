<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  
  <!-- Parkour figure jumping/vaulting -->
  <!-- Head -->
  <circle cx="22" cy="6" r="2.5" fill="#e63228"/>
  
  <!-- Body torso (leaning forward) -->
  <line x1="22" y1="8.5" x2="17" y2="14" stroke="#f5f2ee" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Left arm reaching down (vault hand) -->
  <line x1="19.5" y1="11" x2="14" y2="16" stroke="#f5f2ee" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Right arm trailing back -->
  <line x1="19.5" y1="11" x2="24" y2="8" stroke="#f5f2ee" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Left leg (extended forward) -->
  <line x1="17" y1="14" x2="12" y2="20" stroke="#f5f2ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="20" x2="9" y2="24" stroke="#f5f2ee" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Right leg (bent back) -->
  <line x1="17" y1="14" x2="21" y2="20" stroke="#f5f2ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="20" x2="25" y2="23" stroke="#f5f2ee" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ground/obstacle hint -->
  <line x1="6" y1="26" x2="26" y2="26" stroke="#e63228" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
